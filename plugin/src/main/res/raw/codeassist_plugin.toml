[plugin]
id = "com.devdayton.onecodeforai"
name = "One Code For AI"
version = "1.2.0"
minIdeVersion = "3.33"
mainClass = "com.devdayton.onecodeforai.OneCodeForAIPlugin"
apiVersion = 4
description = "Generates a structured .txt file containing the source code of a directory, optimized for AI context (code2prompt/gitingest style)."
dependsOn = []
entryPoints = ["com.devdayton.onecodeforai.OneCodeForAIPlugin"]
capabilities = ["ui.action", "ui.settingsPage"]
[permissions]
capabilities = ["fs.read", "fs.write"]